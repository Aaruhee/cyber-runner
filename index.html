<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Runner: Neon Dash</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0b0b1a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      touch-action: manipulation;
    }
    #gameContainer {
      position: relative;
      width: 100vw;
      max-width: 480px;
      height: 100vh;
      max-height: 850px;
      background: linear-gradient(180deg, #090a1f 0%, #170d36 100%);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* HUD Overlays */
    .hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .score-box {
      font-size: 22px;
      font-weight: 800;
      color: #00f0ff;
      text-shadow: 0 0 10px #00f0ff;
    }
    .coins-box {
      font-size: 20px;
      font-weight: 800;
      color: #ffd700;
      text-shadow: 0 0 10px #ffd700;
    }
    /* Modals & Popups */
    .modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 10, 26, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 25px;
      text-align: center;
      z-index: 20;
    }
    .hidden {
      display: none !important;
    }
    h1 {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ff007f;
      text-shadow: 0 0 15px #ff007f, 0 0 30px #ff007f;
      margin-bottom: 10px;
    }
    p {
      color: #d1d5db;
      font-size: 15px;
      margin-bottom: 25px;
    }
    .btn {
      background: linear-gradient(90deg, #ff007f, #7928ca);
      color: #fff;
      border: none;
      padding: 14px 30px;
      font-size: 17px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
      margin: 8px 0;
      width: 80%;
      max-width: 260px;
      transition: transform 0.1s ease;
    }
    .btn:active {
      transform: scale(0.96);
    }
    .btn-ad {
      background: linear-gradient(90deg, #00f0ff, #0070f3);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }
    .btn-secondary {
      background: #2a2b4a;
      box-shadow: none;
      color: #bbb;
    }
    /* Ad Simulation Container */
    #adScreen {
      z-index: 30;
      background: #000;
    }
    .ad-card {
      background: #111;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      width: 90%;
      max-width: 320px;
      position: relative;
    }
    .ad-timer {
      font-size: 13px;
      color: #888;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

<div id="gameContainer">
  <div class="hud">
    <div class="score-box" id="scoreDisplay">SCORE: 0</div>
    <div class="coins-box" id="coinsDisplay">⚡ 0</div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <!-- Start Screen -->
  <div id="startScreen" class="modal">
    <h1>CYBER RUNNER</h1>
    <p>Tap to Jump over Neon Obstacles & collect Power Cores!</p>
    <button class="btn" id="startBtn">START GAME</button>
  </div>

  <!-- Game Over Screen -->
  <div id="gameOverScreen" class="modal hidden">
    <h1 style="color:#00f0ff; text-shadow:0 0 15px #00f0ff;">GAME OVER</h1>
    <p id="finalScoreText">Score: 0 | High: 0</p>
    <button class="btn btn-ad" id="reviveBtn">📺 Watch Ad (+1 Life)</button>
    <button class="btn" id="restartBtn">PLAY AGAIN</button>
  </div>

  <!-- Ad Modal for Monetization -->
  <div id="adScreen" class="modal hidden">
    <div class="ad-card">
      <div class="ad-timer" id="adTimerText">Ad playing... (5s)</div>
      <div style="height: 180px; background: #1a1a2e; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 8px; margin-bottom: 15px;">
        <span style="font-size: 32px;">📢</span>
        <span style="color: #00f0ff; font-weight: bold; margin-top: 8px;">AdMob / Unity Ad</span>
        <span style="font-size: 11px; color: #888;">Monetization Slot</span>
      </div>
      <button class="btn btn-secondary" id="closeAdBtn" style="width: 100%; display: none;">Close Ad</button>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const coinsDisplay = document.getElementById('coinsDisplay');
  const startScreen = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const adScreen = document.getElementById('adScreen');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const reviveBtn = document.getElementById('reviveBtn');
  const closeAdBtn = document.getElementById('closeAdBtn');
  const adTimerText = document.getElementById('adTimerText');
  const finalScoreText = document.getElementById('finalScoreText');

  let width, height;
  function resize() {
    width = canvas.width = canvas.parentElement.clientWidth;
    height = canvas.height = canvas.parentElement.clientHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Web Audio Context (No external audio file needed)
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'jump') {
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(450, now + 0.15);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
      osc.start(now);
      osc.stop(now + 0.15);
    } else if (type === 'hit') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(120, now);
      osc.frequency.linearRampToValueAtTime(30, now + 0.25);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (type === 'coin') {
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.setValueAtTime(900, now + 0.08);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.16);
      osc.start(now);
      osc.stop(now + 0.16);
    }
  }

  // Game States
  let isRunning = false;
  let score = 0;
  let coins = 0;
  let highScore = localStorage.getItem('cr_highscore') || 0;
  let speed = 5;
  let frame = 0;
  let hasRevived = false;

  // Ground Setup
  const groundY = () => height - 120;

  // Player Object
  const player = {
    x: 50,
    y: 0,
    w: 32,
    h: 42,
    vy: 0,
    gravity: 0.85,
    jumpStrength: -14,
    grounded: false,
    trail: [],
    reset() {
      this.y = groundY() - this.h;
      this.vy = 0;
      this.grounded = true;
      this.trail = [];
    },
    jump() {
      if (this.grounded) {
        this.vy = this.jumpStrength;
        this.grounded = false;
        playSound('jump');
      }
    },
    update() {
      this.vy += this.gravity;
      this.y += this.vy;

      if (this.y >= groundY() - this.h) {
        this.y = groundY() - this.h;
        this.vy = 0;
        this.grounded = true;
      }

      // Record visual trail
      if (frame % 2 === 0) {
        this.trail.push({ x: this.x, y: this.y, alpha: 0.5 });
        if (this.trail.length > 5) this.trail.shift();
      }
    },
    draw() {
      // Neon Trail
      this.trail.forEach(t => {
        ctx.fillStyle = `rgba(0, 240, 255, ${t.alpha})`;
        ctx.fillRect(t.x, t.y, this.w, this.h);
        t.alpha -= 0.08;
      });

      // Character Body (Cyberpunk Cube)
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#00f0ff';
      ctx.fillStyle = '#00f0ff';
      ctx.fillRect(this.x, this.y, this.w, this.h);

      // Inner Core Accent
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(this.x + 8, this.y + 10, 16, 12);
    }
  };

  // Obstacles & Coins
  let obstacles = [];
  let pickups = [];

  function spawnObstacle() {
    const isDrone = Math.random() > 0.65;
    const obsHeight = isDrone ? 30 : 45 + Math.random() * 20;
    const obsY = isDrone ? groundY() - 75 : groundY() - obsHeight;
    obstacles.push({
      x: width + 40,
      y: obsY,
      w: 24,
      h: obsHeight,
      isDrone: isDrone
    });
  }

  function spawnPickup() {
    pickups.push({
      x: width + 40,
      y: groundY() - 60 - Math.random() * 40,
      r: 8
    });
  }

  // Neon Grid Background
  let bgOffset = 0;
  function drawBackground() {
    bgOffset = (bgOffset + speed * 0.4) % 40;
    ctx.strokeStyle = 'rgba(121, 40, 202, 0.2)';
    ctx.lineWidth = 1;

    for (let x = -bgOffset; x < width; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, height);
      ctx.stroke();
    }

    // Floor Base Line
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#ff007f';
    ctx.strokeStyle = '#ff007f';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, groundY());
    ctx.lineTo(width, groundY());
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Floor Fill
    ctx.fillStyle = '#070817';
    ctx.fillRect(0, groundY(), width, height - groundY());
  }

  // Main Loop
  function gameLoop() {
    if (!isRunning) return;
    frame++;
    ctx.clearRect(0, 0, width, height);

    drawBackground();

    // Player Update
    player.update();
    player.draw();

    // Spawning Logic
    const spawnRate = Math.max(60, 130 - Math.floor(score / 50));
    if (frame % spawnRate === 0) spawnObstacle();
    if (frame % 110 === 0) spawnPickup();

    // Move & Draw Obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.x -= speed;

      ctx.shadowBlur = 12;
      ctx.shadowColor = '#ff0055';
      ctx.fillStyle = o.isDrone ? '#ff00aa' : '#ff0055';
      ctx.fillRect(o.x, o.y, o.w, o.h);
      ctx.shadowBlur = 0;

      // Collision Check
      if (
        player.x < o.x + o.w &&
        player.x + player.w > o.x &&
        player.y < o.y + o.h &&
        player.y + player.h > o.y
      ) {
        gameOver();
        return;
      }

      if (o.x + o.w < -10) obstacles.splice(i, 1);
    }

    // Move & Draw Coins
    for (let i = pickups.length - 1; i >= 0; i--) {
      const p = pickups[i];
      p.x -= speed;

      ctx.shadowBlur = 10;
      ctx.shadowColor = '#ffd700';
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Collect
      const dist = Math.hypot(player.x + player.w / 2 - p.x, player.y + player.h / 2 - p.y);
      if (dist < player.w / 2 + p.r) {
        coins += 1;
        score += 15;
        coinsDisplay.textContent = `⚡ ${coins}`;
        playSound('coin');
        pickups.splice(i, 1);
      } else if (p.x < -10) {
        pickups.splice(i, 1);
      }
    }

    // Progression
    if (frame % 5 === 0) {
      score++;
      scoreDisplay.textContent = `SCORE: ${score}`;
      if (score % 100 === 0) speed += 0.4;
    }

    requestAnimationFrame(gameLoop);
  }

  // Tap Controls
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') player.jump();
  });
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    player.jump();
  }, { passive: false });
  canvas.addEventListener('mousedown', () => player.jump());

  function startGame() {
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    score = 0;
    speed = 5.5;
    obstacles = [];
    pickups = [];
    hasRevived = false;
    reviveBtn.classList.remove('hidden');
    player.reset();
    isRunning = true;
    requestAnimationFrame(gameLoop);
  }

  function gameOver() {
    isRunning = false;
    playSound('hit');
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('cr_highscore', highScore);
    }
    finalScoreText.innerHTML = `Score: <b>${score}</b> | Best: <b>${highScore}</b><br>Cores: ⚡ ${coins}`;
    gameOverScreen.classList.remove('hidden');
  }

  // Ad / Monetization Integration
  function triggerAd(isRewarded = false) {
    adScreen.classList.remove('hidden');
    closeAdBtn.style.display = 'none';
    let timeLeft = 4;
    adTimerText.textContent = `Ad playing... (${timeLeft}s)`;

    const countdown = setInterval(() => {
      timeLeft--;
      if (timeLeft > 0) {
        adTimerText.textContent = `Ad playing... (${timeLeft}s)`;
      } else {
        clearInterval(countdown);
        adTimerText.textContent = `Reward ready!`;
        closeAdBtn.style.display = 'block';
      }
    }, 1000);

    closeAdBtn.onclick = () => {
      adScreen.classList.add('hidden');
      if (isRewarded) {
        // Clear immediate obstacles ahead and revive
        obstacles = obstacles.filter(o => o.x > player.x + 180);
        player.reset();
        isRunning = true;
        hasRevived = true;
        reviveBtn.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        requestAnimationFrame(gameLoop);
      }
    };
  }

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', () => {
    // Show normal interstitial ad every 2 games
    if (Math.random() > 0.4) {
      triggerAd(false);
      closeAdBtn.onclick = () => {
        adScreen.classList.add('hidden');
        startGame();
      };
    } else {
      startGame();
    }
  });

  reviveBtn.addEventListener('click', () => {
    triggerAd(true);
  });
</script>
</body>
</html>
